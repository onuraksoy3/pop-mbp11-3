# /etc/reclocked.conf — MacBook Pro 11,3 on Pop!_OS 24.04 (COSMIC) with the patched 7.0.11-mbp kernel.
# Derived from reclocked's examples/reclocked.conf.mbp11-3-kde. Changes: [dpower] backend = runpm (the kernel
# powers the dGPU off/on; the daemon follows), [profile default] max-pstate raised so the busy-based
# governor can reclock without a Hyprland window feed. Set max-pstate/max to 0f for Apple's factory memory clock.
# window-class rule ([preferred], [caps], [low-power], [dgpu-hard], [dgpu-soft],
# [dgpu-idle], [igpu], [preferred-titles]) is inert and omitted here.

[profile default]
max-pstate = 0e
temp-down = 85
temp-up = 78
# Boost tier above the 07/0a/0e ladder: Apple's factory memory clock, entered after
# sustained load (busy > busy-boost for boost-dwell-ms). -1 disables it.
boost-pstate = 0f
busy-boost = 60
boost-dwell-ms = 1000

[profile preferred]
max-pstate = 0e
temp-down = 85
temp-up = 78
boost-pstate = -1

[global]
interval-ms = 200
poll-ms = 1000
busy-up = 80
busy-down = 60
temp-dwell-ms = 5000
idle-dwell-ms = 1000
profile-dwell-ms = 2000
win-ms = 1000
exit-state = 0a
gr-idle-promille = 500

# Used in dGPU (DIS) mode: 07 deep idle / 0a baseline / 0e heavy. 0f never used.
# temp-per-profile=false: KDE always lands on [profile default] (52 C up-threshold),
# which would block 0e forever — this GPU idles at 57-64 C, peaks 71-75 C at 0e.
[dgpu-active]
enable = true
baseline = 0a
max = 0e
low-power-ceiling = 0a
# none: idle dGPU drops to 07 even while you type (in iGPU mode the dGPU only
# renders offloaded apps, so keyboard/mouse activity says nothing about its load).
# Busy >= deep-idle-busy (20%) raises it to 0a, > busy-enter (80%) to 0e.
activity-source = none
activity-dwell-ms = 8000
deep-idle-busy = 20
busy-enter = 60
busy-exit = 30
temp-per-profile = false
temp-down = 85
temp-up = 78

# Fan curve vs hottest of CPU/dGPU. Quieter start than upstream:
# dGPU mode quiet below 60 C; iGPU mode quiet below 50 C (upstream: 33 C).
# Both reach full speed at 90 C (CPU "high" is 84 C).
[fan]
enable = true
temp-min = 60
temp-mid = 80
fan-mid = 60
temp-max = 90
temp-min-igd = 50
temp-mid-igd = 80
fan-mid-igd = 60
temp-max-igd = 90

# Case-temperature curve. Upstream (20..60 C, soak at 45 C for 5 min) ran fans at
# ~60-70% whenever the case was in its normal 40-48 C band.
# Now: quiet up to 40 C case, full at 60 C; soak only above 50 C, held 2 min.
[fan-case]
enable = true
keys = Ta0P, TaSP, Th1H, Th2H, Ts0S, Ts1S, TM0P, TP0P
case-min = 40
case-max = 60
soak-enter = 50
case-dwell-ms = 5000
hold-ms = 120000
hold-floor = curve
ramp-rpm-s = 150

# Off: forced 100% fans on every gcc/make/cargo run (incl. DKMS/AUR builds).
[compiler]
enable = false

# switchd ON: with backend = runpm it only *monitors* the kernel's power state, but that
# monitoring is what stops the daemon polling a sleeping card (and waking it). Without it
# the dGPU never reaches DynOff. Requires the patched -mbp kernel.
[switch]
enable = true
tick-ms = 1000
dwell-in-ms = 3000
dwell-out-ms = 1000
min-residence-ms = 1000
cooldown-ms = 1000
wait-ready-ms = 2000
min-switch-gap-ms = 1000
temp-gate = 82
busy-enter = 80
busy-exit = 40
title-idle-busy = 70
title-idle-hold-ms = 30000
class-idle-busy = 33
cpu-temp-gate = 70
cpu-temp-promote = 0
busy-idle-dwell-ms = 3000
pstate-settle-ms = 2000
pstate-write-timeout-ms = 2000

[dpower]
backend = runpm
autosuspend-ms = 5000
wait-idle-timeout-ms = 5000
wait-ready-timeout-ms = 10000

[dgpu-procs]
